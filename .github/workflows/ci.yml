name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build, lint, and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the commit metadata gate validates the range
          # F6_BASE_SHA..HEAD and needs the base commit present to compute
          # it. The fixture-integrity check also shells out to git.
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npx prettier --check .

      # The fast deterministic Foundation gate, run FIRST and on its own so
      # that "a Foundation invariant broke" is reported in ~45s rather than
      # after the ~3.5-minute full suite. Every file it runs is also in
      # `npm test` below, so this costs one extra short run and can never
      # disagree with the full one. See vitest.foundation.config.ts.
      - name: Foundation invariant gate
        run: npm run test:foundation

      - name: Test
        run: npm test

      - name: Performance regression guards
        run: npm run test:performance

      - name: Adversarial validation suites
        run: npm run test:adversarial

      # The binding-form grammar sweep (tests/binding-grammar/) and the
      # real-Node oracle harness's own self-tests (tests/oracle/). Neither
      # ran in CI before RWF-051-typecheck. Both are hermetic: real local
      # `node` subprocesses and vendored fixtures on disk, no network --
      # confirmed by running each alone and by correcting
      # scripts/scorecard-sources.mjs's classifier, which had wrongly
      # marked test:oracle as reaching the live OSV API (see docs/SCORECARD.md
      # § 9 and tests/validation/FINDINGS.md's RWF-051 entry).
      - name: Binding-form grammar sweep
        run: npm run test:binding-grammar

      - name: Real-Node oracle harness suite
        run: npm run test:oracle

      # Never ran in CI before F6, which is part of why three commits
      # carrying forbidden metadata reached main: the archive check existed
      # and nothing invoked it, and the commit-metadata check did not exist
      # at all. `fetch-depth: 0` is required so the metadata gate can see
      # the F6 base commit and compute the range it validates; without it
      # the gate degrades to checking only what a shallow clone contains.
      - name: History and commit metadata
        run: npm run validate:history

      # validate:history already runs validate-commit-metadata.mjs as its
      # second half (see package.json), so this repeats a sub-second check
      # that already ran above. Kept as its own step so the AGENTS.md
      # section I gate list has one CI step per named gate, not a merged
      # pair a reader has to know about.
      - name: Commit metadata
        run: npm run validate:metadata

      - name: Scorecard freshness
        run: node scripts/generate-scorecard.mjs --check

      - name: Documentation references
        run: node scripts/check-docs.mjs
